<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cell and Path Visualization</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="main-container">
        <!-- 左侧面板 -->
        <div class="left-panel">
            <div class="panel-header">Path Selection</div>
            <div id="cellSelectionContainer" class="view-container">
                <!-- CellSelection-test.js 的内容将在这里生成 -->
            </div>
            <div class="panel-header">Path Pattern</div>
            <div id="pathPatternContainer" class="view-container">
                <!-- PathPattern.js 的内容将在这里生成 -->
            </div>
        </div>

        <!-- 中间面板，用于显示 Lineage Vis -->
        <div class="middle-panel">
            <div class="panel-header">Lineage Vis</div>
            <div id="lineageVisContainer" class="view-container">
                <!-- LineageVis.js 的内容将在这里生成 -->
            </div>

        </div>

        <!-- 右侧面板 -->
        <div class="right-panel">
            <div id="cellPositionContainer" class="view-container">
                <!-- Cell Position Distribution内容 -->
            </div>
            <div id="markerViewContainer" class="view-container">
                <!-- Marker View内容 -->
            </div>
        </div>

    </div>

    <script src="./js/d3.v7.js"></script>
    <script type="module" src="./js/components/pathSelection/CellSelection-test.js"></script>
    <script type="module" src="./js/components/pathSelection/PathPattern.js"></script>
    <!-- <script type="module" src="./js/components/pathSelection/PathView.js"></script> -->
    <!-- 引入新的 LineageVis 模块 -->
    <script type="module" src="./js/components/pathSelection/LineageVis.js"></script>
    <script type="module" src="./js/components/rightPanel/CellPositionDistribution.js"></script>
    <script type="module" src="./js/components/rightPanel/MarkerView.js"></script>
</body>
</html>
