<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cell and Path Visualization</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <header class="app-topbar">
        <div class="app-title">CellVis</div>
    </header>
    <div class="main-container">
        <!-- 左侧面板 -->
        <div class="left-panel">
            <div class="panel-header">Path Selection</div>
            <div id="cellSelectionContainer" class="view-container">
                <!-- CellSelection-test.js 的内容将在这里生成 -->
            </div>
            <div id="pathPatternContainer" class="view-container">
                <!-- PathPattern.js 的内容将在这里生成 -->
            </div>
        </div>

        <!-- 中间面板，用于显示 Lineage Vis -->
        <div class="middle-panel">
            <div class="panel-header">Lineage Vis</div>
            <div id="lineageVisContainer" class="view-container">
                <!-- LineageVis.js 的内容将在这里生成 -->
            </div>
            
            <!-- 移动到这里：Neighbor Overall Communication -->
            <div id="neighborDetailsContainer" class="view-container" style="height:400px;min-height:400px;max-height:400px;display:flex;flex-direction:column;">
                <!-- OverallCommChart 将在这里渲染 -->
            </div>
        </div>

        <!-- 右侧面板 -->
        <div class="right-panel">
            <div class="panel-header">Communication Channels</div>
            <div id="channelViewContainer" class="view-container" style="height:800px;min-height:800px;max-height:800px;overflow-y:auto;">
                <!-- ChannelView 将在这里渲染 -->
            </div>
        </div>

    </div>

    <script src="./js/d3.v7.js"></script>
    <script type="module" src="./js/components/pathSelection/CellSelection-test.js"></script>
    <script type="module" src="./js/components/pathSelection/PathPattern.js"></script>
    <!-- <script type="module" src="./js/components/pathSelection/PathView.js"></script> -->
    <!-- 引入新的 LineageVis 模块 -->
    <script type="module" src="./js/components/pathSelection/LineageVis.js"></script>
    <script type="module" src="./js/components/pathSelection/ChannelView.js"></script>
    <script type="module" src="./js/components/rightPanel/NeighborDetails.js"></script>
    
    <!-- 初始化ChannelView -->
    <script type="module">
        import { ChannelView } from './js/components/pathSelection/ChannelView.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            // 初始化ChannelView
            window.channelView = new ChannelView('#channelViewContainer');
            console.log('ChannelView initialized');
        });
    </script>
</body>
</html>
